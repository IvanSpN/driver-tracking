name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка образов
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Заглушки только для подстановки в docker-compose.yml — в образы они не попадают
    env:
      DB_PASSWORD: ci
      JWT_ACCESS_SECRET: ci
      JWT_REFRESH_SECRET: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Проверка docker-compose.yml
        run: docker compose config -q

      # Те же Dockerfile, что и на сервере: nest build, vue-tsc и vite build
      - name: Сборка backend и web
        run: docker compose build --progress=plain

  backend:
    name: Backend — линт и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Зависимости
        run: npm ci --workspace=apps/backend

      # package-lock.json собран на Windows, и npm не записал в него linux-бинарник
      # unrs-resolver, без которого не стартует jest (npm/cli#4828) — ставим той же версии
      - name: Нативный модуль для jest
        run: |
          V=$(node -p "require('./apps/backend/node_modules/unrs-resolver/package.json').version")
          npm install --no-save --workspace=apps/backend "@unrs/resolver-binding-linux-x64-gnu@$V"

      - name: Линт
        run: npm run lint:check --workspace=apps/backend

      - name: Тесты
        run: npm test --workspace=apps/backend

  frontend:
    name: Frontend — тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Зависимости
        run: npm ci --workspace=apps/frontend

      # Тесты поднимают vite, а linux-бинарников rolldown и lightningcss в lock-файле нет —
      # то же, что в apps/frontend/Dockerfile
      - name: Нативные модули для vite
        run: |
          RD=$(node -p "require('./apps/frontend/node_modules/rolldown/package.json').version")
          LC=$(node -p "require('./apps/frontend/node_modules/lightningcss/package.json').version")
          npm install --no-save --workspace=apps/frontend \
            "@rolldown/binding-linux-x64-gnu@$RD" "lightningcss-linux-x64-gnu@$LC"

      - name: Тесты
        run: npm test --workspace=apps/frontend

  deploy:
    name: Деплой на сервер
    needs: [build, backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: SSH-ключ
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Ключ на сервере ограничен командой: git reset до origin/main и deploy/deploy.sh
      - name: Деплой
        env:
          SERVER: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
        run: |
          ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$SERVER"
